# Build the overseer image, push it to ACR, and roll it out to the
# Container App. Auth is OIDC federated identity — GitHub's token is
# exchanged for an Azure token at run time; no credentials are stored.
# Deploys are tagged with the git SHA, so `az containerapp revision list`
# is the deploy history and rollback is `az containerapp update
# --image ...:<old-sha>`.

name: Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - "overseer/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for azure/login
  contents: read

# One deploy at a time; a queued push waits rather than racing.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: overseeracr.azurecr.io/overseer

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name overseeracr

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: overseer
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll out to Container App
        run: |
          az extension add --name containerapp --upgrade
          az containerapp update -n overseer -g overseer-rg \
            --image ${{ env.IMAGE }}:${{ github.sha }}
