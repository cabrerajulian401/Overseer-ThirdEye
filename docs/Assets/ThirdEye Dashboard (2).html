ter\">Cancel<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ cfSave }}\" style=\"background:#111;color:#fff;border:none;border-radius:7px;padding:9px 18px;font-size:12.5px;font-weight:600;cursor:pointer\">{{ cfSaveLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCheckups }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:24px 32px 48px 32px;max-width:1120px\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:20px\">\n          <h1 style=\"margin:0;font-size:27px;font-weight:700;letter-spacing:-0.035em\">Checkups<\u002Fh1>\n          <button sc-camel-on-click=\"{{ onNewCheckup }}\" style=\"margin-left:auto;background:#111;color:#fff;border:none;border-radius:6px;padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer\" style-hover=\"background:#333\">New Checkup<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasGaps }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:rgba(255,255,255,0.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.85);border-radius:9px;box-shadow:0 4px 16px rgba(60,58,54,0.09);margin-bottom:16px;overflow:hidden\">\n            <div style=\"padding:11px 16px;border-bottom:1px solid #eee;font-size:12.5px;font-weight:700\">Not covered — {{ gapCountLabel }}<\u002Fdiv>\n            <sc-for list=\"{{ coverageGaps }}\" as=\"g\" hint-placeholder-count=\"2\">\n              <div style=\"padding:11px 16px;border-bottom:1px solid #f2f2f2;display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n                <div style=\"min-width:200px;flex:1\">\n                  <div style=\"font-size:12.5px;font-weight:600\">{{ g.vendor_name }}<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#6b6b6b;margin-top:2px;font-family:ui-monospace,Menlo,monospace\">{{ g.poLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ g.onSetUp }}\" style=\"background:#111;color:#fff;border:none;border-radius:5px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;margin-left:auto\" style-hover=\"background:#333\">Set up checkup<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ checkupsEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:70px;text-align:center\">\n            <div style=\"font-size:14px;font-weight:600;margin-bottom:6px\">No checkups yet<\u002Fdiv>\n            <div style=\"font-size:13px;color:#6b6b6b\">Set one up and ThirdEye will chase your vendors on a schedule.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasStopped }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-for list=\"{{ stoppedCheckups }}\" as=\"st\" hint-placeholder-count=\"1\">\n            <div style=\"background:rgba(255,255,255,0.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.85);border-radius:9px;box-shadow:0 6px 20px rgba(60,58,54,0.10);padding:13px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n              <div style=\"min-width:0\">\n                <div style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.06em;margin-bottom:3px\">STOPPED — NEEDS YOU<\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:600;letter-spacing:-0.025em\">{{ st.vendor_name }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#5f5c56;margin-top:2px\">{{ st.reasonLine }}<\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ st.onSendMore }}\" style=\"margin-left:auto;background:#111;color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"background:#333\">Send one more<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ schedule }}\" as=\"sd\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;gap:14px;align-items:flex-start;padding-bottom:13px\">\n            <div style=\"width:76px;flex-shrink:0;text-align:right\">\n              <sc-if value=\"{{ sd.showEyebrow }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.06em\">{{ sd.dateEyebrow }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"font-size:{{ sd.dateSize }};font-weight:{{ sd.dateWeight }};letter-spacing:-0.03em\">{{ sd.dateLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"width:2px;background:{{ sd.railColor }};align-self:stretch;flex-shrink:0;border-radius:2px\"><\u002Fdiv>\n            <div style=\"flex:1;min-width:0;background:{{ sd.cardBg }};backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.85);border-radius:9px;box-shadow:{{ sd.cardShadow }};padding:12px 15px\">\n              <div sc-camel-on-click=\"{{ sd.onExpand }}\" style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0;cursor:pointer\">\n                <span style=\"font-size:{{ sd.nameSize }};font-weight:{{ sd.nameWeight }};letter-spacing:-0.025em\">{{ sd.vendor_name }}<\u002Fspan>\n                <span style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.06em\">{{ sd.metaCaps }}<\u002Fspan>\n                <span style=\"margin-left:auto;font-size:11px;color:#5f5c56;text-decoration:underline;text-underline-offset:2px\">{{ sd.expandLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ sd.expanded }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"border-left:2px solid rgba(0,0,0,0.16);padding-left:11px;font-size:12.5px;color:#444;line-height:1.55;margin-top:10px\">\n                  “{{ sd.message_template }}”\n                  <sc-if value=\"{{ sd.hasAttachment }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.06em;margin-top:5px\">⎘ {{ sd.attachmentName }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:11px\">\n                  <div><div style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.06em\">TRIGGER<\u002Fdiv><div style=\"font-size:13px;font-weight:500;margin-top:2px\">{{ sd.triggerLabel }}<\u002Fdiv><\u002Fdiv>\n                  <div><div style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.06em\">NEXT CHECK<\u002Fdiv><div style=\"font-size:13px;font-weight:500;margin-top:2px\">{{ sd.nextLabel }}<\u002Fdiv><\u002Fdiv>\n                  <div><div style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.06em\">LAST SENT<\u002Fdiv><div style=\"font-size:13px;margin-top:2px\">{{ sd.lastSentLabel }}<\u002Fdiv><\u002Fdiv>\n                  <div><div style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.06em\">LAST REPLY<\u002Fdiv><div style=\"font-size:13px;margin-top:2px\">{{ sd.lastReplyLabel }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ sd.hasReply }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"border:1px solid rgba(0,0,0,0.08);background:rgba(255,255,255,0.5);border-radius:7px;padding:10px 12px;margin-top:11px\">\n                    <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:5px\">\n                      <span style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.06em\">VENDOR REPLY<\u002Fspan>\n                      <a href=\"{{ sd.threadLink }}\" target=\"_blank\" style=\"font-size:11px;margin-left:auto\">Open thread<\u002Fa>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12.5px;line-height:1.5;color:#333\">“{{ sd.replyLine }}”<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"margin-top:11px\">\n                  <div style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.06em;margin-bottom:5px\">SENT WITHOUT A REPLY<\u002Fdiv>\n                  <div style=\"display:flex;gap:4px\">\n                    <sc-for list=\"{{ sd.capSegments }}\" as=\"cs\" hint-placeholder-count=\"3\"><div style=\"height:5px;flex:1;border-radius:3px;background:{{ cs }}\"><\u002Fdiv><\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center\">\n                  <button sc-camel-on-click=\"{{ sd.onSendNow }}\" style=\"background:#111;color:#fff;border:none;border-radius:6px;padding:6px 13px;font-size:11.5px;font-weight:600;cursor:pointer\" style-hover=\"background:#333\">Send now<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ sd.onSkip }}\" style=\"background:rgba(255,255,255,0.9);border:1px solid rgba(0,0,0,0.14);border-radius:6px;padding:6px 13px;font-size:11.5px;font-weight:600;cursor:pointer\">Skip this one<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ sd.onToggle }}\" style=\"background:rgba(255,255,255,0.9);border:1px solid rgba(0,0,0,0.14);border-radius:6px;padding:6px 13px;font-size:11.5px;font-weight:600;cursor:pointer\">{{ sd.toggleLabel }}<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ sd.onEditRow }}\" style=\"background:rgba(255,255,255,0.9);border:1px solid rgba(0,0,0,0.14);border-radius:6px;padding:6px 13px;font-size:11.5px;font-weight:600;cursor:pointer\">Edit<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ sd.onDelete }}\" style=\"background:none;border:none;font-size:11.5px;color:#5f5c56;cursor:pointer;padding:0\">Delete<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ sd.onHistory }}\" style=\"margin-left:auto;background:none;border:none;font-size:11.5px;color:#5f5c56;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0\">{{ sd.historyLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n                <sc-if value=\"{{ sd.historyOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"border-top:1px solid rgba(0,0,0,0.07);margin-top:12px;padding-top:11px;display:flex;flex-direction:column;gap:9px\">\n                    <sc-for list=\"{{ sd.history }}\" as=\"h\" hint-placeholder-count=\"2\">\n                      <div style=\"display:flex;gap:10px;font-size:12px\">\n                        <span style=\"color:#5f5c56;width:48px;flex-shrink:0\">{{ h.dateLabel }}<\u002Fspan>\n                        <span style=\"font-weight:600;width:44px;flex-shrink:0\">{{ h.dir }}<\u002Fspan>\n                        <div style=\"min-width:0;flex:1\">\n                          <div style=\"color:#444\">{{ h.text }}<\u002Fdiv>\n                          <sc-if value=\"{{ h.hasBody }}\" hint-placeholder-val=\"{{ false }}\">\n                            <div style=\"margin-top:5px;border-left:2px solid {{ h.bodyBorder }};padding-left:9px;font-size:11.5px;line-height:1.5;color:#555\">“{{ h.body }}”<\u002Fdiv>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <\u002Fdiv><\u002Fsc-if>\n\n    <sc-if value=\"{{ isAudit }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:24px 32px 48px 32px\">\n        <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:20px\">\n          <h1 style=\"margin:0;font-size:27px;font-weight:700;letter-spacing:-0.035em\">Audit<\u002Fh1>\n          <div style=\"margin-left:auto;display:flex;align-items:baseline;gap:9px;background:rgba(255,255,255,0.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.85);border-radius:9px;box-shadow:0 4px 16px rgba(60,58,54,0.09);padding:9px 14px\">\n            <span style=\"font-size:11.5px;color:#6b6b6b\">Total Exposure<\u002Fspan>\n            <span style=\"font-size:19px;font-weight:700;letter-spacing:-0.02em\">{{ totalExposureLabel }}<\u002Fspan>\n            <span style=\"font-size:11.5px;color:#8a8a8a\">{{ exposureCountLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap;align-items:center\">\n          <sc-for list=\"{{ auditFilters }}\" as=\"af\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ af.go }}\" style=\"border:1px solid {{ af.border }};background:{{ af.bg }};color:{{ af.color }};border-radius:20px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer\">{{ af.label }} · {{ af.count }}<\u002Fbutton>\n          <\u002Fsc-for>\n          <button sc-camel-on-click=\"{{ toggleAuditGroup }}\" style=\"margin-left:auto;border:1px solid #d4d4d4;background:#fff;border-radius:6px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer\" style-hover=\"border-color:#111\">{{ auditGroupLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ auditEmptyAll }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:70px;text-align:center\">\n            <div style=\"font-size:14px;font-weight:600;margin-bottom:6px\">Nothing to review<\u002Fdiv>\n            <div style=\"font-size:13px;color:#6b6b6b\">{{ auditEmptyStats }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ auditEmptyFiltered }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:60px;text-align:center\">\n            <div style=\"font-size:13.5px;color:#6b6b6b;margin-bottom:14px\">{{ auditEmptyFilteredLabel }}<\u002Fdiv>\n und:#111;color:#fff;border-radius:10px;padding:18px 20px;box-shadow:0 10px 34px rgba(0,0,0,0.28)\">\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:9px\">\n        <span style=\"font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:#9a9a9a\">Tutorial · {{ tutorialStepLabel }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ onTutorialSkip }}\" style=\"margin-left:auto;border:none;background:none;color:#9a9a9a;font-size:11.5px;cursor:pointer;padding:0\">Skip<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:14.5px;font-weight:700;margin-bottom:7px\">{{ tutorialTitle }}<\u002Fdiv>\n      <div style=\"font-size:12.5px;line-height:1.6;color:#d4d4d4\">{{ tutorialBody }}<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-top:16px\">\n        <div style=\"display:flex;gap:4px\">\n          <sc-for list=\"{{ tutorialDots }}\" as=\"td\" hint-placeholder-count=\"8\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ td }};display:block\"><\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-left:auto;display:flex;gap:8px\">\n          <sc-if value=\"{{ tutorialShowBack }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ onTutorialBack }}\" style=\"border:1px solid #444;background:none;color:#fff;border-radius:5px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer\">Back<\u002Fbutton>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ onTutorialNext }}\" style=\"border:none;background:#fff;color:#111;border-radius:5px;padding:6px 15px;font-size:12px;font-weight:700;cursor:pointer\">{{ tutorialNextLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ confirmOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(30,29,26,0.26);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:80;display:flex;align-items:center;justify-content:center\">\n      <div style=\"background:#fff;border-radius:10px;width:440px;max-width:92vw;padding:22px;box-shadow:0 20px 52px rgba(30,29,26,0.34)\">\n        <div style=\"font-size:15px;font-weight:700;margin-bottom:8px\">{{ confirmTitle }}<\u002Fdiv>\n        <div style=\"font-size:13px;color:#555;line-height:1.55;white-space:pre-wrap\">{{ confirmBody }}<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;justify-content:flex-end;margin-top:20px\">\n          <button sc-camel-on-click=\"{{ confirmCancel }}\" style=\"border:1px solid #d4d4d4;background:#fff;border-radius:6px;padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer\">{{ confirmCancelLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ confirmGo }}\" style=\"border:none;background:{{ confirmBtnBg }};color:#fff;border-radius:6px;padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer\">{{ confirmLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;show_empty_state&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo states&quot;},&quot;inbox_disconnected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo states&quot;},&quot;sheet_disconnected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo states&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    authDone: false, authPhase: 'start', authEmail: '', returning: false, syncPct: 0, syncLine: 0,\n    profile: { first_name: '', last_name: '', business_name: '', industry: '', phone_number: '' },\n    grantMail: false, grantFiles: false,\n    tutorialStep: 0, tutorialDone: false,\n    view: 'board', selectedOrder: null,\n    sortBy: 'last_activity_date', filterStatus: 'All', filterVendor: 'All', query: '', page: 1,\n    conn: { inbox: true, sheet: true }, ignore: { inbox: false, sheet: false }, onboard: { inbox: false, sheet: false },\n    sheetFile: 'Order Tracker 2026.xlsx', sheetTab: 'Sheet1',\n    mapping: { order_number: 'PO Number', vendor_name: 'Supplier', item_description: 'Description', quantity: 'Units', unit_price: 'Price/Unit', total_value: 'Total USD', order_date: 'Date Ordered', expected_ship_date: 'ETD', order_stage: 'Stage' },\n    wizard: null, queuedEmails: 14, processing: false, processingLabel: '',\n    toasts: [], confirm: null, createOrder: null, docPreview: null,\n    ottoTab: 'All', drafts: {}, undoReject: null, expandedError: {}, writeFlow: null, statFilter: null, auditGroup: false, historyOpen: null, dispute: null, selectedQueueId: null, destOverride: {}, sheetPicker: null, splitRows: false,\n    checkupForm: null, expandedCheckup: null,\n    auditFilter: 'All', auditDetail: {}, noteOpen: {}, noteDraft: {},\n    editTarget: {}, assigned: {}, showDismissedReview: false, detailDraft: {}, manualOrder: null, nrPanelOpen: false,\n    orders: [], queue: [], checkups: [], flags: [], needsReview: [], dismissedReview: [], vendors: [], unknownSenders: []\n  };\n\n  componentDidMount() { this.seed(); }\n\n  toast(message, actionLabel, onAction) {\n    const id = Math.random();\n    this.setState(s => ({ toasts: [...s.toasts, { id, message, actionLabel, onAction }] }));\n    setTimeout(() => this.setState(s => ({ toasts: s.toasts.filter(t => t.id !== id) })), actionLabel ? 10000 : 3000);\n  }\n  ask(cfg) { this.setState({ confirm: cfg }); }\n  closeConfirm() { this.setState({ confirm: null }); }\n\n  fmt(d) { if (!d) return '—'; const dt = new Date(d + 'T00:00:00'); return (dt.getMonth() + 1) + '/' + dt.getDate() + '/' + dt.getFullYear(); }\n  fmtShort(d) { if (!d) return '—'; const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }\n  money(n, dec) { if (n == null) return '—'; return '$' + n.toLocaleString('en-US', { minimumFractionDigits: dec ?? 0, maximumFractionDigits: dec ?? 2 }); }\n  num(n) { return n == null ? '—' : n.toLocaleString('en-US'); }\n  abbrevMoney(n) {\n    if (n == null) return '—';\n    if (n >= 1000000) return '$' + (n / 1000000).toFixed(n >= 10000000 ? 0 : 1).replace(/\\.0$/, '') + 'M';\n    if (n >= 1000) return '$' + Math.round(n / 1000) + 'K';\n    return '$' + Math.round(n);\n  }\n  addDays(d, n) { const dt = new Date(d + 'T00:00:00'); dt.setDate(dt.getDate() + n); return dt.toISOString().slice(0, 10); }\n  daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }\n\n  stagePill(stage) {\n    if (stage === 'Delivered') return { bg: '#111', color: '#fff', border: '#111' };\n    if (stage === 'Shipped') return { bg: '#e9e9e9', color: '#111', border: '#d4d4d4' };\n    return { bg: '#f7f7f7', color: '#444', border: '#d4d4d4' };\n  }\n  statusPill(s) {\n    const red = { bg: '#fdecea', color: '#b3261e', border: '#f0c4c0' };\n    const amber = { bg: '#fdf3e0', color: '#8a5a00', border: '#ecd9ae' };\n    const dark = { bg: '#111', color: '#fff', border: '#111' };\n    const gray = { bg: '#f7f7f7', color: '#444', border: '#d4d4d4' };\n    const mute = { bg: '#f7f7f7', color: '#8a8a8a', border: '#e0e0e0' };\n    const map = { 'New': dark, 'Failed': dark, 'Sync Failed': dark, 'Awaiting Manual Check': gray, 'Low': gray, 'Medium': gray, 'Retrying': gray, 'Pending Review': gray, 'Pending': amber, 'Mismatch': red, 'High': gray, 'Synced': gray, 'Accepted': gray, 'Corrected': gray, 'Rejected': mute, 'Not synced': mute, 'Sync paused': mute, 'Reconciled': gray, 'Active': dark, 'Reply Received': gray, 'Paused': mute, 'Reviewed': gray, 'Dismissed': mute, 'Archived': mute };\n    return map[s] || gray;\n  }\n  typeGlyph(t) { return { 'Price'
