  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

etter-spacing:-0.02em\">ThirdEye<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:2px\">\n      <sc-for list=\"{{ navItems }}\" as=\"nv\" hint-placeholder-count=\"6\">\n        <div sc-camel-on-click=\"{{ nv.go }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13.5px;background:{{ nv.bg }};color:{{ nv.color }};font-weight:{{ nv.fw }}\" style-hover=\"background:{{ nv.hoverBg }}\">\n          <span>{{ nv.label }}<\u002Fspan>\n          <sc-if value=\"{{ nv.showBadge }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"min-width:18px;height:18px;border-radius:9px;background:{{ nv.badgeBg }};color:{{ nv.badgeColor }};font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px\">{{ nv.badge }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:2px\">\n      <div sc-camel-on-click=\"{{ goVendors }}\" style=\"display:flex;align-items:center;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13.5px;background:{{ vendorsBg }};color:{{ vendorsColor }};font-weight:{{ vendorsFw }}\" style-hover=\"background:#f0f0f0\">Contact List<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goAccount }}\" style=\"display:flex;align-items:center;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13.5px;background:{{ accountBg }};color:{{ accountColor }};font-weight:{{ accountFw }}\" style-hover=\"background:#f0f0f0\">Account<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goSettings }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13.5px;background:{{ settingsBg }};color:{{ settingsColor }};font-weight:{{ settingsFw }}\" style-hover=\"background:#f0f0f0\">\n        <span>Settings<\u002Fspan>\n        <s -columns:8px 8px;grid-template-rows:8px 8px;gap:2px\">\n              <span style=\"background:#f25022;display:block\"><\u002Fspan><span style=\"background:#7fba00;display:block\"><\u002Fspan>\n              <span style=\"background:#00a4ef;display:block\"><\u002Fspan><span style=\"background:#ffb900;display:block\"><\u002Fspan>\n            <\u002Fspan>\n            Continue with Outlook\n          <\u002Fbutton>\n          <div style=\"font-size:11.5px;color:#8a8a8a;text-align:center;margin:9px 0 20px\">Microsoft Outlook accounts only during beta<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:20px\"><span style=\"flex:1;height:1px;background:#e5e5e5\"><\u002Fspan><span style=\"font-size:11px;color:#8a8a8a\">or use a business email<\u002Fspan><span style=\"flex:1;height:1px;background:#e5e5e5\"><\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:8px\">\n            <input value=\"{{ authEmail }}\" sc-camel-on-change=\"{{ onAuthEmail }}\" placeholder=\"you@yourcompany.com\" style=\"flex:1;box-sizing:border-box;border:1px solid #d4d4d4;border-radius:7px;padding:12px 13px;font-size:13px\">\n            <button sc-camel-on-click=\"{{ onContinueEmail }}\" style=\"border:1px solid #111;background:#fff;border-radius:7px;padding:12px 18px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"background:#111;color:#fff\">Continue<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#8a8a8a;text-align:center;margin-top:12px\">{{ startModeLabel }}<\u002Fdiv>\n          <div style=\"font-size:11px;color:#8a8a8a;margin-top:20px;line-height:1.5\">By continuing you agree to the beta terms. We read email to build your order board — we never send on your behalf without a Checkup you set up.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 380px;min-width:340px;background:#111;color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:center\">\n        <div style=\"max-width:400px\">\n          <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#8a8a8a;margin-bottom:20px\">What you get<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:22px\">\n            <div><div style=\"font-size:14px;font-weight:700;margin-bottom:5px\">An order board that fills itself<\u002Fdiv><div style=\"font-size:13px;color:#bdbdbd;line-height:1.55\">Every PO, stage and ship date pulled from vendor threads. No spreadsheet retyping.<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-size:14px;font-weight:700;margin-bottom:5px\">Otto reads the attachments<\u002Fdiv><div style=\"font-size:13px;color:#bdbdbd;line-height:1.55\">Invoices, packing lists and BOLs parsed into fields you approve before anything is written.<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-size:14px;font-weight:700;margin-bottom:5px\">Checkups chase your vendors<\u002Fdiv><div style=\"font-size:13px;color:#bdbdbd;line-height:1.55\">Scheduled status emails that stop the moment a vendor replies.<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-size:14px;font-weight:700;margin-bottom:5px\">Audit catches quiet changes<\u002Fdiv><div style=\"font-size:13px;color:#bdbdbd;line-height:1.55\">A price or quantity moves mid-order and you hear about it the same day, with the quote.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAuthChoose }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;align-items:center;justify-content:center;background:#f3f3f3;padding:40px\">\n      <div style=\"width:420px;max-width:94vw;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,0.16);padding:44px 44px 32px\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:26px\">\n          <span style=\"display:grid;grid-template-columns:10px 10px;grid-template-rows:10px 10px;gap:2px\">\n            <span style=\"background:#f25022;display:block\"><\u002Fspan><span style=\"background:#7fba00;display:block\"><\u002Fspan>\n            <span style=\"background:#00a4ef;display:block\"><\u002Fspan><span style=\"background:#ffb900;display:block\"><\u002Fspan>\n          <\u002Fspan>\n          <span style=\"font-size:15px;color:#5e5e5e\">Microsoft<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:22px;font-weight:600;margin-bottom:20px\">Choose an account<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\">\n          <sc-for list=\"{{ accountOptions }}\" as=\"ac\" hint-placeholder-count=\"2\">\n            <div sc-camel-on-click=\"{{ ac.pick }}\" style=\"display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #eee;cursor:pointer\" style-hover=\"background:#f7f7f7\">\n              <span style=\"width:32px;height:32px;border-radius:50%;background:#6b6b6b;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center\">{{ ac.initials }}<\u002Fspan>\n              <div style=\"min-width:0\"><div style=\"font-size:14px\">{{ ac.email }}<\u002Fdiv><div style=\"font-size:12px;color:#8a8a8a\">{{ ac.statusLabel }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div sc-camel-on-click=\"{{ onUseAnotherAccount }}\" style=\"display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer\" style-hover=\"background:#f7f7f7\">\n            <span style=\"width:32px;height:32px;border-radius:50%;border:1px solid #d4d4d4;color:#5e5e5e;font-size:15px;display:flex;align-items:center;justify-content:center\">+<\u002Fspan>\n            <span style=\"font-size:14px\">Use another account<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:26px\"><button sc-camel-on-click=\"{{ onBackToStart }}\" style=\"border:none;background:none;font-size:12.5px;color:#0067b8;cursor:pointer;padding:0\">Back<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAuthSignIn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;align-items:center;justify-content:center;background:#f3f3f3;padding:40px\">\n      <div style=\"width:420px;max-width:94vw;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,0.16);padding:44px\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:22px\">\n          <span style=\"display:grid;grid-template-columns:10px 10px;grid-template-rows:10px 10px;gap:2px\">\n            <span style=\"background:#f25022;display:block\"><\u002Fspan><span style=\"background:#7fba00;display:block\"><\u002Fspan>\n            <span style=\"background:#00a4ef;display:block\"><\u002Fspan><span style=\"background:#ffb900;display:block\"><\u002Fspan>\n          <\u002Fspan>\n          <span style=\"font-size:15px;color:#5e5e5e\">Microsoft<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:#1b1b1b;margin-bottom:18px\">\n          <button sc-camel-on-click=\"{{ onBackToChoose }}\" style=\"border:none;background:none;font-size:15px;color:#5e5e5e;cursor:pointer;padding:0\">←<\u002Fbutton>\n          <span>{{ signInEmail }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:22px;font-weight:600;margin-bottom:6px\">Sign in to ThirdEye.tools<\u002Fdiv>\n        <div style=\"font-size:13px;color:#5e5e5e;margin-bottom:22px;line-height:1.5\">{{ signInConsentCopy }}<\u002Fdiv>\n        <input type=\"password\" sc-camel-default-value=\"············\" style=\"width:100%;box-sizing:border-box;border:none;border-bottom:1px solid #666;padding:8px 2px;font-size:15px;margin-bottom:8px\">\n        <div style=\"font-size:13px;color:#0067b8;margin-bottom:26px\">Forgot password?<\u002Fdiv>\n        <div style=\"display:flex;justify-content:flex-end\">\n          <button sc-camel-on-click=\"{{ onSignIn }}\" style=\"background:#0067b8;color:#fff;border:none;padding:9px 34px;font-size:14px;cursor:pointer\" style-hover=\"background:#005da6\">Sign in<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAuthProfile }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:48px 24px\">\n      <div style=\"width:520px;max-width:94vw\">\n        <div style=\"display:flex;align-items:center;gap:8px;font-size:11.5px;color:#8a8a8a;margin-bottom:16px\">\n          <span style=\"width:26px;height:3px;background:#111;border-radius:2px\"><\u002Fspan><span style=\"width:26px;height:3px;background:#111;border-radius:2px\"><\u002Fspan><span style=\"width:26px;height:3px;background:#e0e0e0;border-radius:2px\"><\u002Fspan>\n          <span style=\"margin-left:6px\">Step 2 of 3 — About you<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"margin:0 0 6px;font-size:23px;font-weight:700;letter-spacing:-0.02em\">Tell us about your business<\u002Fh1>\n        <div style=\"font-size:13px;color:#6b6b6b;margin-bottom:24px\">We use this to label your orders and address vendor emails properly.<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e5e5e5;border-radius:9px;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n          <sc-for list=\"{{ profileFields }}\" as=\"pf\" hint-placeholder-count=\"4\">\n            <div><div style=\"font-size:11px;color:#8a8a8a;margin-bottom:4px\">{{ pf.label }}<\u002Fdiv><input value=\"{{ pf.value }}\" sc-camel-on-change=\"{{ pf.onChange }}\" placeholder=\"{{ pf.ph }}\" style=\"width:100%;box-sizing:border-box;border:1px solid #d4d4d4;border-radius:6px;padding:9px 11px;font-size:13px\"><\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"grid-column:1 / -1\">\n            <div style=\"font-size:11px;color:#8a8a8a;margin-bottom:4px\">Industry<\u002Fdiv>\n            <sc-raw-select value=\"{{ industryValue }}\" sc-camel-on-change=\"{{ onIndustry }}\" style=\"width:100%;box-sizing:border-box;border:1px solid #d4d4d4;border-radius:6px;padding:9px 11px;font-size:13px;background:#fff;cursor:pointer\">\n              <option value=\"\">Choose an industry…<\u002Foption>\n              <sc-for list=\"{{ industryOptions }}\" as=\"io\" hint-placeholder-count=\"6\"><option value=\"{{ io }}\">{{ io }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onProfileContinue }}\" style=\"width:100%;margin-top:16px;background:#111;color:#fff;border:none;border-radius:7px;padding:13px;font-size:13.5px;font-weight:700;cursor:pointer;opacity:{{ profileOpacity }}\">Continue<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAuthGrant }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:48px 24px\">\n      <div style=\"width:520px;max-width:94vw\">\n        <div style=\"display:flex;align-items:center;gap:8px;font-size:11.5px;color:#8a8a8a;margin-bottom:16px\">\n          <span style=\"width:26px;height:3px;background:#111;border-radius:2px\"><\u002Fspan><span style=\"width:26px;height:3px;background:#111;border-radius:2px\"><\u002Fspan><span style=\"width:26px;height:3px;background:#111;border-radius:2px\"><\u002Fspan>\n          <span style=\"margin-left:6px\">Step 3 of 3 — Permissions<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"margin:0 0 6px;font-size:23px;font-weight:700;letter-spacing:-0.02em\">Authorize &amp; sync your email<\u002Fh1>\n        <div style=\"font-size:13px;color:#6b6b6b;margin-bottom:24px\">ThirdEye connects through Microsoft Graph. Grant both to continue — you can revoke either one in Settings.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"background:#fff;border:1px solid #e5e5e5;border-radius:9px;padding:16px;display:flex;align-items:center;gap:14px\">\n            <div style=\"flex:1\"><div style=\"font-size:13.5px;font-weight:700\">Mail.ReadWrite<\u002Fdiv><div style=\"font-size:12.5px;color:#6b6b6b;margin-top:3px;line-height:1.5\">Read vendor threads and attachments, and send the Checkup emails you configure.<\u002Fdiv><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onGrantMail }}\" style=\"background:{{ grantMailBg }};color:{{ grantMailColor }};border:1px solid #d4d4d4;border-radius:6px;padding:9px 18px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">{{ grantMailLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e5e5e5;border-radius:9px;padding:16px;display:flex;align-items:center;gap:14px\">\n            <div style=\"flex:1\"><div style=\"font-size:13.5px;font-weight:700\">Files.ReadWrite<\u002Fdiv><div style=\"font-size:12.5px;color:#6b6b6b;margin-top:3px;line-height:1.5\">Write approved extractions into the Excel workbook you choose. Only the mapped columns.<\u002Fdiv><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onGrantFiles }}\" style=\"background:{{ grantFilesBg }};color:{{ grantFilesColor }};border:1px solid #d4d4d4;border-radius:6px;padding:9px 18px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">{{ grantFilesLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onStartSync }}\" style=\"width:100%;margin-top:16px;background:#111;color:#fff;border:none;border-radius:7px;padding:13px;font-size:13.5px;font-weight:700;cursor:pointer;opacity:{{ grantOpacity }}\">Sync my orders<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAuthSync }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fafafa;padding:40px\">\n      <div style=\"margin-bottom:26px\">\n        <svg width=\"132\" height=\"132\" sc-camel-view-box=\"0 0 132 132\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n          <defs>\n            <clipPath id=\"teEye\"><circle cx=\"66\" cy=\"66\" r=\"50.8\"><\u002Fcircle><\u002FclipPath>\n          <\u002Fdefs>\n          <g clip-path=\"url(#teEye)\">\n            <rect x=\"0\" y=\"0\" width=\"132\" height=\"132\" fill=\"#ffffff\"><\u002Frect>\n            <circle cx=\"66\" cy=\"66\" r=\"16.2\" fill=\"#111111\" style=\"animation:te-look 5.6s cubic-bezier(.5,.02,.2,1) infinite\"><\u002Fcircle>\n            <rect x=\"0\" y=\"0\" width=\"132\" height=\"132\" fill=\"#ffffff\" style=\"transform-origin:50% 0;animation:te-lid 5.6s cubic-bezier(.4,0,.25,1) infinite\"><\u002Frect>\n          <\u002Fg>\n          <circle cx=\"66\" cy=\"66\" r=\"55.4\" stroke=\"#111111\" stroke-width=\"9.2\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-size:17px;font-weight:700;letter-spacing:-0.02em;margin-bottom:8px\">{{ syncHeadline }}<\u002Fdiv>\n      <div style=\"font-size:13px;color:#6b6b6b;margin-bottom:22px;animation:te-pulse 1.6s ease-in-out infinite\">{{ syncLine }}<\u002Fdiv>\n      <div style=\"width:300px;height:4px;background:#e5e5e5;border-radius:3px;overflow:hidden\"><div style=\"height:100%;background:#111;width:{{ syncBarWidth }}\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"font-size:11.5px;color:#8a8a8a;margin-top:10px\">{{ syncPctLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ authDone }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"flex:1;overflow-y:auto;min-width:0;position:relative\">\n    <sc-if value=\"{{ showChrome }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:sticky;top:0;z-index:5;background:rgba(255,255,255,0.60);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,0.85);padding:12px 32px;display:flex;align-items:center;gap:12px\">\n        <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Search orders by Order #, Vendor, or Item\" style=\"flex:1;max-width:460px;box-sizing:border-box;background:#ffffff;border:1px solid #dcdcdc;border-radius:6px;padding:8px 12px;font-size:13px;background:#fff\">\n        <sc-if value=\"{{ hasQuery }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size:12px;color:#6b6b6b\">{{ searchCountLabel }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ clearQuery }}\" style=\"border:1px solid #d4d4d4;background:#fff;border-radius:5px;padding:5px 11px;font-size:12px;cursor:pointer\">Clear<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ inboxDisconnected }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#111;color:#fff;padding:10px 28px;font-size:13px;display:flex;align-items:center;gap:14px\">\n        <span>Inbox disconnected — reconnect<\u002Fspan>\n        <span style=\"color:#bdbdbd;font-size:12px\">{{ queuedLabel }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ startInboxReconnect }}\" style=\"margin-left:auto;background:#fff;color:#111;border:none;border-radius:5px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer\">Reconnect<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ sheetDisconnected }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fdf3e0;color:#8a5a00;border-bottom:1px solid #ecd9ae;padding:10px 28px;font-size:13px;display:flex;align-items:center;gap:14px\">\n        <span>Spreadsheet disconnected — Otto is holding extractions until it reconnects<\u002Fspan>\n        <button sc-camel-on-click=\"{{ startSheetReconnect }}\" style=\"margin-left:auto;background:#111;color:#fff;border:none;border-radius:5px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer\">Reconnect Spreadsheet<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ processing }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#f2f2f2;border-bottom:1px solid #e5e5e5;padding:9px 28px;font-size:12.5px;color:#444\">{{ processingLabel }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showOnboarding }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;padding:96px 20px\">\n        <div style=\"width:44px;height:44px;border-radius:50%;border:2px solid #d4d4d4;display:flex;align-items:center;justify-content:center;margin-bottom:20px\"><div style=\"width:14px;height:14px;border-radius:50%;background:#d4d4d4\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:20px;font-weight:700;letter-spacing:-0.02em;margin-bottom:8px\">Connect your inbox to start tracking orders<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#6b6b6b;max-width:420px;text-align:center;margin-bottom:28px\">Two connections and ThirdEye runs on its own: your inbox is the source of truth, your spreadsheet is where Otto writes.<\u002Fdiv>\n        <div style=\"width:460px;max-width:92vw;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"background:rgba(255,255,255,0.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.85);border-radius:9px;box-shadow:0 4px 16px rgba(60,58,54,0.09);padding:16px;display:flex;align-items:center;gap:14px\">\n            <span style=\"width:26px;height:26px;border-radius:50%;border:1px solid #d4d4d4;background:{{ onboardInboxBg }};color:{{ onboardInboxColor }};font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">{{ onboardInboxMark }}<\u002Fspan>\n            <div style=\"flex:1\"><div style=\"font-size:13.5px;font-weight:700\">Inbox<\u002Fdiv><div style=\"font-size:12px;color:#6b6b6b\">Outlook / Microsoft account<\u002Fdiv><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onConnectInbox }}\" style=\"background:#111;color:#fff;border:none;border-radius:6px;padding:9px 16px;font-size:12.5px;font-weight:600;cursor:pointer\" style-hover=\"background:#333\">{{ onboardInboxLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"background:rgba(255,255,255,0.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.85);border-radius:9px;box-shadow:0 4px 16px rgba(60,58,54,0.09);padding:16px;display:flex;align-items:center;gap:14px;opacity:{{ onboardSheetOpacity }}\">\n            <span style=\"width:26px;height:26px;border-radius:50%;border:1px solid #d4d4d4;background:{{ onboardSheetBg }};color:{{ onboardSheetColor }};font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">{{ onboardSheetMark }}<\u002Fspan>\n            <div style=\"flex:1\"><div style=\"font-size:13.5px;font-weight:700\">Spreadsheet<\u002Fdiv><div style=\"font-size:12px;color:#6b6b6b\">Excel on OneDrive — where Otto writes extractions<\u002Fdiv><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onConnectSheet }}\" disabled=\"{{ onboardSheetDisabled }}\" style=\"background:#111;color:#fff;border:none;border-radius:6px;padding:9px 16px;font-size:12.5px;font-weight:600;cursor:pointer\" style-hover=\"background:#333\">{{ onboardSheetLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ onboardBothDone }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ onEnterDashboard }}\" style=\"margin-top:8px;background:#111;color:#fff;border:none;border-radius:6px;padding:12px 16px;font-size:13.5px;font-weight:700;cursor:pointer\">Go to Order Board<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fdiv><\u002Fsc-if>\n\n    <sc-if value=\"{{ wizardOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:fixed;inset:0;background:rgba(30,29,26,0.26);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:70;display:flex;align-items:center;justify-content:center;padding:24px\">\n        <div style=\"background:#fff;border-radius:10px;width:760px;max-width:96vw;max-height:88vh;overflow-y:auto;box-shadow:0 20px 52px rgba(30,29,26,0.34)\">\n          <div style=\"padding:18px 22px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px\">\n            <div><div style=\"font-size:15px;font-weight:700\">Connect Spreadsheet<\u002Fdiv><div style=\"font-size:12px;color:#8a8a8a;margin-top:2px\">{{ wizardStepLabel }}<\u002Fdiv><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ wizardClose }}\" style=\"margin-left:auto;border:1px solid #d4d4d4;background:#fff;border-radius:6px;padding:6px 12px;font-size:12.5px;cursor:pointer\">Cancel<\u002Fbutton>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ wizardStep1 }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:20px 22px\">\n              <div style=\"font-size:12px;color:#6b6b6b;margin-bottom:12px\">Recent files on OneDrive<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ recentFiles }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <div sc-camel-on-click=\"{{ f.pick }}\" style=\"border:1px solid {{ f.border }};background:{{ f.bg }};border-radius:7px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:12px\" style-hover=\"border-color:#111\">\n                    <span style=\"font-size:11px;font-weight:700;border:1px solid #d4d4d4;border-radius:4px;padding:3px 6px;background:#fff\">XLSX<\u002Fspan>\n                    <div><div style=\"font-size:13px;font-weight:600\">{{ f.name }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8a8a8a;margin-top:1px\">{{ f.meta }}<\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div sc-camel-on-click=\"{{ pickNewSheet }}\" style=\"border:1px dashed {{ newSheetBorder } ceholder-count=\"7\"><option value=\"{{ v }}\">{{ v }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <sc-if value=\"{{ hasStatFilter }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:#111;color:#fff;border-radius:20px;padding:4px 6px 4px 12px;font-size:12px;font-weight:600;white-space:nowrap\">\n              {{ statFilterLabel }}\n              <button sc-camel-on-click=\"{{ clearStatFilter }}\" style=\"border:none;background:rgba(255,255,255,0.2);color:#fff;border-radius:50%;width:17px;height:17px;font-size:11px;line-height:1;cursor:pointer;padding:0\">×<\u002Fbutton>\n            <\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:60px;text-align:center\">\n            <div style=\"font-size:14px;font-weight:600;margin-bottom:6px\">{{ emptyHeadline }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#6b6b6b;margin-bottom:16px\">{{ emptySubline }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ resetFilters }}\" style=\"border:1px solid #111;background:#fff;border-radius:6px;padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer\">Clear filters<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px\">\n          <sc-for list=\"{{ cards }}\" as=\"c\" hint-placeholder-count=\"9\">\n            <div sc-camel-on-click=\"{{ c.open }}\" style=\"min-width:0;background:rgba(255,255,255,0.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:{{ c.cardBorderWidth }} solid {{ c.cardBorder }};border-radius:9px;box-shadow:0 6px 20px rgba(60,58,54,0.10);padding:12px 13px;cursor:pointer;display:flex;flex-direction:column;gap:8px\" style-hover=\"border-color:#111\">\n              <div style=\"display:flex;align-items:center;gap:8px;min-width:0\">\n                <span style=\"font-size:15px;font-weight:600;letter-spacing:-0.025em\">{{ c.order_number }}<\u002Fspan>\n                <span style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.05em;white-space:nowrap\">{{ c.stageCaps }}<\u002Fspan>\n                <sc-if value=\"{{ c.showContested }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:9.5px;font-weight:600;letter-spacing:0.05em;padding:1px 7px;border-radius:20px;border:1px solid #111;white-space:nowrap\">CONTESTED<\u002Fspan>\n                <\u002Fsc-if>\n                <span style=\"margin-left:auto;font-size:17px;font-weight:{{ c.shipWeight }};letter-spacing:-0.03em;white-space:nowrap\">{{ c.expectedShipLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:3px\">\n                <sc-for list=\"{{ c.stageDots }}\" as=\"dt\" hint-placeholder-count=\"5\"><div style=\"height:2px;flex:1;border-radius:2px;background:{{ dt }}\"><\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:8px;min-width:0\">\n                <span style=\"font-size:13px;font-weight:500;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ c.item_description }}<\u002Fspan>\n                <span style=\"margin-left:auto;font-size:17px;font-weight:500;letter-spacing:-0.03em;white-space:nowrap\">{{ c.totalLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ c.vendorLine }}<\u002Fdiv>\n              <sc-if value=\"{{ c.showAtStake }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:baseline;gap:8px;border-top:1px solid rgba(0,0,0,0.07);padding-top:7px\">\n                  <span style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.05em\">AT STAKE<\u002Fspan>\n                  <span style=\"margin-left:auto;font-size:15px;font-weight:700;letter-spacing:-0.025em\">{{ c.atStakeLabel }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fdiv><\u002Fsc-if>\n\n    <sc-if value=\"{{ createOrderOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:fixed;inset:0;background:rgba(30,29,26,0.26);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:75;display:flex;align-items:center;justify-content:center;padding:24px\">\n        <div style=\"background:#fff;border-radius:10px;width:620px;max-width:96vw;padding:22px;box-shadow:0 20px 52px rgba(30,29,26,0.34)\">\n          <div style=\"font-size:15px;font-weight:700;margin-bottom:4px\">Create New Order<\u002Fdiv>\n          <div style=\"font-size:12px;color:#8a8a8a;margin-bottom:18px\">Pre-filled from: {{ coSubject }}<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n            <sc-for list=\"{{ coFields }}\" as=\"f\" hint-placeholder-count=\"7\">\n              <div>\n                <div style=\"font-size:11px;color:#8a8a8a;margin-bottom:4px\">{{ f.label }}{{ f.star }}<\u002Fdiv>\n                <input value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" style=\"width:100%;box-sizing:border-box;border:1px solid #d4d4d4;border-radius:6px;padding:8px 10px;font-size:12.5px\">\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#8a8a8a;margin-top:14px\">Created orders start at Status “Ordered” with a manual override, and the source email becomes the first timeline entry.<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;justify-content:flex-end;margin-top:18px\">\n            <button sc-camel-on-click=\"{{ coCancel }}\" style=\"border:1px solid #d4d4d4;background:#fff;border-radius:6px;padding:9px 16px;font-size:12.5px;font-weight:600;cursor:pointer\">Cancel<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ coCreate }}\" style=\"background:#111;color:#fff;border:none;border-radius:6px;padding:9px 18px;font-size:12.5px;font-weight:600;cursor:pointer\">Create Order<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv><\u002Fsc-if>\n\n    <sc-if value=\"{{ isDetail }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:24px 32px 48px 32px;max-width:1080px\">\n        <div sc-camel-on-click=\"{{ goBoardClick }}\" style=\"font-size:12.5px;color:#6b6b6b;cursor:pointer;margin-bottom:16px;display:inline-block\" style-hover=\"color:#111\">← Back to Order Board<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap\">\n          <h1 style=\"margin:0;font-size:27px;font-weight:700;letter-spacing:-0.035em\">{{ d.order_number }}<\u002Fh1>\n          <span style=\"font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:{{ d.stageBg }};color:{{ d.stageColor }};border:1px solid {{ d.stageBorder }}\">{{ d.order_stage }}<\u002Fspan>\n          <div style=\"margin-left:auto;display:flex;align-items:center;gap:8px\">\n            <span style=\"font-size:12px;color:#6b6b6b\">Status<\u002Fspan>\n            <sc-raw-select value=\"{{ d.order_stage }}\" sc-camel-on-change=\"{{ d.onStageChange }}\" style=\"border:1px solid #d4d4d4;border-radius:6px;padding:7px 10px;font-size:12.5px;background:#fff;cursor:pointer\">\n              <option value=\"Ordered\">Ordered<\u002Foption>\n              <option value=\"Confirmed\">Confirmed<\u002Foption>\n              <option value=\"In Production\">In Production<\u002Foption>\n              <option value=\"Shipped\">Shipped<\u002Foption>\n              <option value=\"Delivered\">Delivered<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#6b6b6b;margin-bottom:10px\">{{ d.vendor_name }} · {{ d.item_description }}<\u002Fdiv>\n        <div style=\"display:inline-flex;align-items:center;gap:7px;background:#f2f2f2;border:1px solid #e5e5e5;border-radius:6px;padding:6px 11px;font-size:12px;color:#555;margin-bottom:20px\">\n          <span style=\"font-weight:700\">ⓘ<\u002Fspan> Information on this order is auto-filled from vendor emails and documents. Edit any field and save to correct it.\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1.2fr 0.8fr;gap:16px;align-items:start\">\n          <div style=\"display:flex;flex-direction:column;gap:16px;min-width:0\">\n            <div style=\"background:rgba(255,255,255,0.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.85);border-radius:9px;box-shadow:0 4px 16px rgba(60,58,54,0.09);padding:18px\">\n              <div style=\"font-size:13px;font-weight:700;margin-bottom:14px\">Order Summary<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px\">\n                <sc-for list=\"{{ d.editFields }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <div>\n                    <div style=\"font-size:11px;color:#8a8a8a;margin-bottom:4px\">{{ f.label }}<\u002Fdiv>\n                    <input value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" style=\"width:100%;box-sizing:border-box;border:1px solid #e0e0e0;border-radius:6px;padding:7px 9px;font-size:12.5px;background:{{ f.bg }};color:#111\">\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"font-size:11px;color:#8a8a8a;margin:18px 0 6px\">Items<\u002Fdiv>\n              <div style=\"border:1px solid #eee;border-radius:7px;overflow:hidden\">\n                <div style=\"display:flex;gap:8px;padding:7px 10px;background:#f7f7f7;border-bottom:1px solid #eee;font-size:10.5px;color:#8a8a8a\">\n                  <span style=\"flex:2.4\">Item<\u002Fspan><span style=\"flex:0.8\">Qty<\u002Fspan><span style=\"flex:0.9\">Unit Price<\u002Fspan><span style=\"flex:1.1\">Expected Ship<\u002Fspan><span style=\"width:74px;text-align:right\">Line Total<\u002Fspan><span style=\"width:20px\"><\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ d.itemRows }}\" as=\"ir\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid #f5f5f5\">\n                    <sc-for list=\"{{ ir.cells }}\" as=\"cell\" hint-placeholder-count=\"4\">\n                      <input value=\"{{ cell.value }}\" sc-camel-on-change=\"{{ cell.onChange }}\" style=\"flex:{{ cell.flex }};min-width:0;box-sizing:border-box;border:1px solid #e0e0e0;border-radius:5px;padding:6px 8px;font-size:12px\">\n                    <\u002Fsc-for>\n                    <span style=\"width:74px;text-align:right;font-size:12px;font-weight:600\">{{ ir.lineTotal }}<\u002Fspan>\n                    <sc-if value=\"{{ ir.canRemove }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button sc-camel-on-click=\"{{ ir.onRemove }}\" title=\"Remove item\" style=\"width:20px;height:20px;border:1px solid #e0e0e0;background:#fff;border-radius:4px;font-size:12px;line-height:1;color:#8a8a8a;cursor:pointer;padding:0\" style-hover=\"border-color:#111;color:#111\">×<\u002Fbutton>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display:flex;align-items:center;gap:10px;padding:8px 10px\">\n                  <button sc-camel-on-click=\"{{ d.onAddItem }}\" style=\"border:1px solid #d4d4d4;background:#fff;border-radius:5px;padding:5px 11px;font-size:11.5px;font-weight:600;cursor:pointer\" style-hover=\"border-color:#111\">+ Add item<\u002Fbutton>\n                  <span style=\"margin-left:auto;font-size:11px;color:#8a8a8a\">Total Order Value<\u002Fspan>\n                  <span style=\"font-size:14px;font-weight:700;letter-spacing:-0.01em\">{{ d.computedTotal }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ d.statedMismatch }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:8px;font-size:11.5px;color:#b3261e;line-height:1.45\">Vendor document states {{ d.statedTotal }} ({{ d.statedDelta }} difference)<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;gap:8px;margin-top:16px;justify-content:flex-end;align-items:center\">\n                <a href=\"{{ d.source_email_link }}\" target=\"_blank\" style=\"font-size:12px;margin-right:auto\">View Email<\u002Fa>\n                <sc-if value=\"{{ d.hasDraft }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button sc-camel-on-click=\"{{ d.onDiscardDraft }}\" style=\"border:1px solid #d4d4d4;background:#fff;border-radius:6px;padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer\">Discard changes<\u002Fbutton>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ d.onSaveSummary }}\" style=\"background:#111;color:#fff;border:none;border-radius:6px;padding:8px 18px;font-size:12.5px;font-weight:700;cursor:pointer;opacity:{{ d.saveOpacity }}\" style-hover=\"background:#333\">Save<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:rgba(255,255,255,0.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.85);border-radius:9px;box-shadow:0 4px 16px rgba(60,58,54,0.09);padding:18px\">\n              <div style=\"font-size:13px;font-weight:700;margin-bottom:14px\">Requested vs. Confirmed<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:110px 1fr 1fr;gap:0;font-size:12.5px\">\n                <div><\u002Fdiv>\n                <div style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.06em;padding:6px 10px;border-bottom:1px solid rgba(0,0,0,0.07)\">REQUESTED<\u002Fdiv>\n                <div style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.06em;padding:6px 10px;border-bottom:1px solid rgba(0,0,0,0.07)\">CONFIRMED<\u002Fdiv>\n                <sc-for list=\"{{ d.reqVsConf }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <div style=\"padding:9px 0;border-bottom:1px solid rgba(0,0,0,0.05);color:#5f5c56;font-size:12px\">{{ r.label }}<\u002Fdiv>\n                  <div style=\"padding:9px 10px;border-bottom:1px solid rgba(0,0,0,0.05)\">{{ r.requested }}<\u002Fdiv>\n                  <div style=\"padding:9px 10px;border-bottom:1px solid rgba(0,0,0,0.05);font-weight:{{ r.confWeight }};color:{{ r.confColor }};background:{{ r.confBg }}\">{{ r.confirmed }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:rgba(255,255,255,0.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.85);border-radius:9px;box-shadow:0 4px 16px rgba(60,58,54,0.09);padding:18px\">\n              <div style=\"font-size:13px;font-weight:700;margin-bottom:14px\">Documents<\u002Fdiv>\n              <sc-if value=\"{{ d.noDocs }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12.5px;color:#8a8a8a\">No documents parsed for this order yet.<\u002Fdiv><\u002Fsc-if>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ d.documents }}\" as=\"doc\" hint-placeholder-count=\"2\">\n                  <div sc-camel-on-click=\"{{ doc.onOpen }}\" style=\"display:flex;align-items:center;gap:12px;border:1px solid {{ doc.rowBorder }};border-radius:6px;padding:10px 12px;cursor:pointer\" style-hover=\"border-color:#111\">\n                    <span style=\"font-size:11px;font-weight:700;border:1px solid #d4d4d4;border-radius:4px;padding:3px 7px;background:#f7f7f7;white-space:nowrap\">{{ doc.doc_type }}<\u002Fspan>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ doc.filename }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8a8a8a\">Received {{ doc.receivedLabel }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"font-size:11.5px;color:#6b6b6b;white-space:nowrap\">{{ doc.compareLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ d.docOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border:1px solid #111;border-radius:7px;margin-top:12px;overflow:hidden\">\n                  <div style=\"padding:11px 14px;background:#f7f7f7;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;gap:10px\">\n                    <span style=\"font-size:12.5px;font-weight:700\">{{ d.docName }}<\u002Fspan>\n                    <span style=\"font-size:11.5px;color:#6b6b6b\">parsed {{ d.docType }} vs. order<\u002Fspan>\n                    <a href=\"{{ d.source_email_link }}\" target=\"_blank\" style=\"margin-left:auto;font-size:12px\">View original PDF<\u002Fa>\n                    <button sc-camel-on-click=\"{{ d.closeDoc }}\" style=\"border:1px solid #d4d4d4;background:#fff;border-radius:5px;padding:4px 10px;font-size:11.5px;cursor:pointer\">Close<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:130px 1fr 1fr;font-size:12.5px\">\n                    <div style=\"padding:7px 12px;font-size:11px;color:#8a8a8a;border-bottom:1px solid #eee\"><\u002Fdiv>\n                    <div style=\"padding:7px 12px;font-size:11px;color:#8a8a8a;border-bottom:1px solid #eee\">In document<\u002Fdiv>\n                    <div style=\"padding:7px 12px;font-size:11px;color:#8a8a8a;border-bottom:1px solid #eee\">On order<\u002Fdiv>\n                    <sc-for list=\"{{ d.docCompare }}\" as=\"cr\" hint-placeholder-count=\"4\">\n                      <div style=\"padding:9px 12px;border-bottom:1px solid #f5f5f5;color:#6b6b6b;font-size:12px\">{{ cr.label }}<\u002Fdiv>\n                      <div style=\"padding:9px 12px;border-bottom:1px solid #f5f5f5;color:{{ cr.color }};font-weight:{{ cr.weight }};background:{{ cr.bg }}\">{{ cr.docValue }}<\u002Fdiv>\n                      <div style=\"padding:9px 12px;border-bottom:1px solid #f5f5f5\">{{ cr.orderValue }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div style=\"background:rgba(255,255,255,0.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.85);border-radius:9px;box-shadow:0 4px 16px rgba(60,58,54,0.09);padding:18px\">\n              <div style=\"font-size:13px;font-weight:700;margin-bottom:14px\">Discrepancies<\u002Fdiv>\n              <sc-if value=\"{{ d.noFlags }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12.5px;color:#5f5c56\">No discrepancies on this order.<\u002Fdiv><\u002Fsc-if>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ d.flags }}\" as=\"fl\" hint-placeholder-count=\"1\">\n                  <div style=\"border:1px solid rgba(0,0,0,0.08);border-radius:8px;padding:13px;opacity:{{ fl.rowOpacity }}\">\n                    <div style=\"display:flex;align-items:baseline;gap:9px;flex-wrap:wrap\">\n                      <span style=\"font-size:13.5px;font-weight:600;letter-spacing:-0.02em\">{{ fl.discrepancy_type }}<\u002Fspan>\n                      <span style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.06em\">{{ fl.evidence_source }}<\u002Fspan>\n                      <span style=\"margin-left:auto;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:{{ fl.stBg }};color:{{ fl.stColor }};border:1px solid {{ fl.stBorder }}\">{{ fl.flag_status }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;align-items:baseline;gap:12px;margin-top:9px\">\n                      <span style=\"font-size:17px;font-weight:500;letter-spacing:-0.03em;flex:1;min-width:0\">{{ fl.changeLabel }}<\u002Fspan>\n                      <sc-if value=\"{{ fl.isOpen }}\" hint-placeholder-val=\"{{ true }}\">\n                        <span style=\"text-align:right;flex-shrink:0\"><span style=\"display:block;font-size:9.5px;color:#5f5c56;letter-spacing:0.06em\">AT STAKE<\u002Fspan><span style=\"display:block;font-size:17px;font-weight:700;letter-spacing:-0.03em\">{{ fl.impactValue }}<\u002Fspan><\u002Fspan>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ fl.isResolved }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span style=\"font-size:12px;color:#5f5c56;flex-shrink:0\">{{ fl.resolvedNote }}<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12.5px;color:#444;margin-top:9px;border-left:2px solid rgba(0,0,0,0.16);padding-left:10px;line-height:1.55\">“{{ fl.evidence_snippet }}”<\u002Fdiv>\n                    <div style=\"display:flex;gap:8px;margin-top:11px;align-items:center;flex-wrap:wrap\">\n                      <sc-if value=\"{{ fl.isOpen }}\" hint-placeholder-val=\"{{ true }}\">\n                        <button sc-camel-on-click=\"{{ fl.onAccept }}\" style=\"background:#111;color:#fff;border:none;border-radius:6px;padding:6px 13px;font-size:11.5px;font-weight:600;cursor:pointer\">Accept change<\u002Fbutton>\n                        <button sc-camel-on-click=\"{{ fl.onDispute }}\" style=\"background:rgba(255,255,255,0.9);border:1px solid #111;border-radius:6px;padding:6px 13px;font-size:11.5px;font-weight:600;cursor:pointer\">Dispute<\u002Fbutton>\n                        <button sc-camel-on-click=\"{{ fl.onDismiss }}\" style=\"border:none;background:none;font-size:11.5px;color:#5f5c56;cursor:pointer;padding:0\">Dismiss<\u002Fbutton>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ fl.isResolved }}\" hint-placeholder-val=\"{{ false }}\">\n                        <button sc-camel-on-click=\"{{ fl.onReopen }}\" style=\"background:rgba(255,255,255,0.9);border:1px solid rgba(0,0,0,0.14);border-radius:6px;padding:6px 13px;font-size:11.5px;font-weight:600;cursor:pointer\">Reopen<\u002Fbutton>\n                      <\u002Fsc-if>\n                      <a href=\"{{ fl.draftLink }}\" style=\"font-size:11.5px;margin-left:auto\">Draft Email to Vendor<\u002Fa>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:rgba(255,255,255,0.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.85);border-radius:9px;box-shadow:0 4px 16px rgba(60,58,54,0.09);padding:18px\">\n            <div style=\"font-size:13px;font-weight:700;margin-bottom:14px\">Activity Timeline<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column\">\n              <sc-for list=\"{{ d.timeline }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;gap:12px;padding-bottom:16px\">\n                  <div style=\"display:flex;flex-direction:column;align-items:center;flex-shrink:0\">\n                    <span style=\"width:24px;height:24px;border-radius:50%;border:1px solid #d4d4d4;background:{{ t.dotBg }};color:{{ t.dotColor }};font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center\">{{ t.glyph }}<\u002Fspan>\n                    <sc-if value=\"{{ t.showLine }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"width:1px;flex:1;background:#e5e5e5;marg >\n\n          <sc-if value=\"{{ hasSelection }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:12px\">\n\n            <div style=\"background:rgba(255,255,255,0.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.85);border-radius:9px;box-shadow:0 6px 20px rgba(60,58,54,0.10);padding:12px 15px;display:flex;align-items:center;gap:11px;flex-wrap:wrap\">\n              <span style=\"font-size:10px;font-weight:700;border:1px solid rgba(0,0,0,0.16);border-radius:4px;padding:3px 6px;background:rgba(255,255,255,0.9)\">XLSX<\u002Fspan>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:13px;font-weight:600;letter-spacing:-0.02em\">{{ destFile }} · {{ destTab }}<\u002Fdiv>\n                <div style=\"font-size:9.5px;color:#5f5c56;letter-spacing:0.06em;margin-top:2px\">{{ destMappedCaps }} · {{ destRowLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ onChangeDest }}\" style=\"margin-left:auto;background:rgba(255,255,255,0.9);border:1px solid rgba(0,0,0,0.14);border-radius:6px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"border-color:#111\">Change destination<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"background:rgba(255,255,255,0.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.85);border-radius:9px;box-shadow:0 6px 20px rgba(60,58,54,0.10);overflow:hidden\">\n              <div style=\"display:flex;gap:10px;padding:9px 14px;background:rgba(0,0,0,0.04);border-bottom:1px solid rgba(0,0,0,0.07);font-size:9.5px;color:#5f5c56;letter-spacing:0.06em\">\n                <span style=\"width:26px\">#<\u002Fspan><span style=\"flex:1\">DESCRIPTION<\u002Fspan><span style=\"width:70px;text-align:right\">TOTAL<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ previewRows }}\" as=\"pv\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;gap:10px;padding:9px 14px;align-items:baseline;border-bottom:1px solid rgba(0,0,0,0.04);opacity:{{ pv.rowOpacity }};background:{{ pv.rowBg }};border-top:{{ pv.rowTop }};border-bottom:{{ pv.rowBottom }}\">\n                  <span style=\"width:26px;font-size:12px;font-weight:{{ pv.weight }}\">{{ pv.num }}<\u002Fspan>\n                  <span style=\"flex:1;min-width:0;font-size:12.5px;font-weight:{{ pv.weight }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ pv.desc }}<\u002Fspan>\n                  <span style=\"width:70px;text-align:right;font-size:{{ pv.totalSize }};font-weight:500;letter-spacing:-0.03em\">{{ pv.total }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:8px 14px;font-size:9.5px;color:#5f5c56;letter-spacing:0.06em\">{{ staleNote }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:rgba(255,255,255,0.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.85);border-radius:9px;box-shadow:0 6px 20px rgba(60,58,54,0.10);padding:15px 16px\">\n              <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px\">\n                <span style=\"font-size:17px;font-weight:600;letter-spacing:-0.025em\">{{ selPo }}<\u002Fspan>\n                <span style=\"font-size:12.5px;color:#5f5c56\">{{ selVendor }}<\u002Fspan>\n                <span style=\"margin-left:auto;font-size:9.5px;color:#5f5c56;letter-spacing:0.06em\">{{ selMetaCaps }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:11px\">\n                <sc-for list=\"{{ selFields }}\" as=\"sf\" hint-placeholder-count=\"4\">\n                  <div style=\"min-width:0\">\n                    <div style=\"font-si
